<!-- ES6 Module untuk Render Globe 3D Murni Tanpa Arcs -->
<script type="module">
import Globe from 'https://esm.sh/globe.gl';

const container = document.getElementById('globe-bg');
if (container) {
    const world = Globe()(container)
        .backgroundColor('#050508')
        .showAtmosphere(true)
        .atmosphereColor('#00f0ff')
        .atmosphereAltitude(0.25)
        .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
        .width(window.innerWidth)
        .height(window.innerHeight - 150);

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.8;
    world.controls().enableZoom = false;

    world.pointOfView({ lat: 25, lng: 0, altitude: 2.3 });

    fetch('https://unpkg.com/globe.gl/example/datasets/ne_110m_admin_0_countries.geojson')
        .then(res => res.json())
        .then(countries => {
            world.polygonsData(countries.features)
                .polygonCapColor(() => 'rgba(0, 0, 0, 0)')
                .polygonSideColor(() => 'rgba(0, 0, 0, 0)')
                .polygonStrokeColor(() => '#00f0ff');
        });

    window.addEventListener('resize', () => {
        world.width(window.innerWidth);
        world.height(window.innerHeight - 150);
    });
}
</script>
